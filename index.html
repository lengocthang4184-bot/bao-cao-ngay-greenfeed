<!DOCTYPE html>
<html lang="vi">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Báo cáo ngày - GreenFeed</title>
<style>
  :root {
    --gf-green: #00843D;
    --gf-green-dark: #00612d;
    --gf-green-light: #e6f4ec;
    --gf-blue: #0072ce;
    --bg: #f4f6f5;
    --card-bg: #ffffff;
    --text: #1a1f1c;
    --text-muted: #6b7570;
    --border: #e1e6e3;
    --danger: #c62828;
    --warn: #b8860b;
    --ok: #00843D;
  }
  html { height: 100%; }
  * { box-sizing: border-box; }
  body {
    margin: 0;
    background: var(--bg);
    color: var(--text);
    font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Helvetica, Arial, sans-serif;
    min-height: 100%;
    padding-bottom: 24px;
  }
  header {
    background: linear-gradient(135deg, var(--gf-green), var(--gf-green-dark));
    color: #fff;
    padding: 16px 16px 14px;
    position: sticky;
    top: 0;
    z-index: 10;
  }
  header h1 { margin: 0; font-size: 18px; font-weight: 700; }
  header .sub { font-size: 12px; opacity: 0.85; margin-top: 2px; display:flex; justify-content:space-between; align-items:center; gap:8px; }
  header .sub button { background: rgba(255,255,255,0.18); border: none; color: #fff; padding: 4px 10px; border-radius: 999px; font-size: 11.5px; cursor: pointer; }
  nav.tabs { display: flex; gap: 6px; padding: 10px 12px 0; overflow-x: auto; }
  nav.tabs button {
    background: rgba(255,255,255,0.15); border: none; color: #fff; padding: 8px 14px;
    border-radius: 999px; font-size: 13px; font-weight: 600; white-space: nowrap; cursor: pointer;
  }
  nav.tabs button.active { background: #fff; color: var(--gf-green-dark); }
  main { max-width: 720px; margin: 0 auto; padding: 14px 12px 40px; }
  .card { background: var(--card-bg); border: 1px solid var(--border); border-radius: 14px; padding: 14px; margin-bottom: 12px; }
  .card h2 { margin: 0 0 10px; font-size: 15px; font-weight: 700; }
  .card h3 { margin: 14px 0 8px; font-size: 13px; font-weight: 700; color: var(--text-muted); text-transform: uppercase; letter-spacing: 0.02em; }
  label { display: block; font-size: 12.5px; font-weight: 600; margin: 10px 0 4px; color: var(--text-muted); }
  input[type=text], input[type=number], input[type=date], select, textarea {
    width: 100%; padding: 9px 10px; border-radius: 9px; border: 1px solid var(--border);
    background: var(--bg); color: var(--text); font-size: 14px;
  }
  textarea { min-height: 60px; resize: vertical; }
  .btn {
    display: inline-block; background: var(--gf-green); color: #fff; border: none; padding: 10px 16px;
    border-radius: 9px; font-size: 14px; font-weight: 700; cursor: pointer; margin-top: 10px;
  }
  .btn.secondary { background: var(--bg); color: var(--gf-green-dark); border: 1px solid var(--border); }
  .btn.danger { background: var(--danger); }
  .btn.small { padding: 6px 10px; font-size: 12.5px; margin-top: 0; }
  .row { display: flex; gap: 8px; flex-wrap: wrap; }
  .row > * { flex: 1; min-width: 120px; }
  .banner { background: var(--gf-green-light); border: 1px solid var(--gf-green); color: var(--gf-green-dark); padding: 10px 12px; border-radius: 10px; font-size: 13px; margin-bottom: 10px; }
  .banner.warn { background: #fff8e1; border-color: var(--warn); color: #7a5b00; }
  label .tag { font-weight: 400; color: var(--text-muted); font-size: 11.5px; }
  .toggle-more {
    margin-top: 12px; background: var(--gf-green-light); color: var(--gf-green-dark); border: 1px dashed var(--gf-green);
    border-radius: 9px; padding: 9px 12px; font-size: 13px; font-weight: 600; cursor: pointer; text-align: center;
    display: flex; align-items: center; justify-content: center; gap: 6px;
  }
  .more-box { display: none; margin-top: 8px; padding: 10px 12px 2px; background: var(--gf-green-light); border-radius: 9px; }
  .more-box.open { display: block; }
  .cmeta { font-size: 12.5px; color: var(--text-muted); margin-top: 2px; line-height: 1.5; }
  .cmeta b.k, .meta b.k { color: var(--text-muted); font-weight: 600; }
  .cmeta .ex, .meta .ex { display: inline-block; margin-right: 4px; }
  .geo-row { display: flex; align-items: center; gap: 8px; flex-wrap: wrap; margin: 4px 0 10px; }
  .geo-row input { flex: 1; min-width: 140px; }
  .badge { display: inline-block; padding: 2px 9px; border-radius: 999px; font-size: 11.5px; font-weight: 700; }
  .badge.done { background: #e3f5e9; color: #0a7a34; }
  .badge.progress { background: #fff3d6; color: #9a6a00; }
  .badge.notdone { background: #fde3e3; color: #a91e1e; }
  .badge.pending { background: #eceff1; color: #52606a; }
  .table-wrap { overflow-x: auto; -webkit-overflow-scrolling: touch; margin: 0 -4px; }
  table.entries-table { border-collapse: collapse; width: 100%; min-width: 560px; font-size: 12.5px; }
  table.entries-table th { background: var(--gf-green); color: #fff; padding: 8px 6px; text-align: left; font-size: 11.5px; font-weight: 700; position: sticky; top: 0; }
  table.entries-table td { padding: 7px 6px; border-bottom: 1px solid var(--border); vertical-align: top; }
  table.entries-table tr:nth-child(even) td { background: rgba(0,132,61,0.04); }
  table.entries-table .stt { width: 24px; color: var(--text-muted); text-align: center; }
  table.entries-table .content-cell b { display:block; font-size: 12.5px; }
  table.entries-table .content-cell .cmeta { color: var(--text-muted); font-size: 11.5px; margin-top: 2px; }
  table.entries-table .status-cell { min-width: 88px; }
  table.entries-table .icon-row { display: flex; gap: 3px; margin-top: 5px; }
  table.entries-table .icon-btn { border: 1px solid var(--border); background: var(--bg); border-radius: 6px; font-size: 12px; padding: 2px 5px; cursor: pointer; line-height: 1; }
  table.entries-table .icon-btn.on-done { border-color: var(--ok); background: var(--gf-green-light); }
  table.entries-table .icon-btn.on-progress { border-color: var(--warn); background: #fff8e1; }
  table.entries-table .icon-btn.on-notdone { border-color: var(--danger); background: #fdeaea; }
  table.entries-table .result-cell { width: 108px; font-size: 11.5px; color: var(--text-muted); white-space: normal; }
  table.entries-table .del-cell { width: 28px; text-align: center; }
  table.entries-table .del-cell a { color: var(--danger); font-size: 15px; cursor: pointer; }
  table.entries-table .inline-form-row td { background: var(--gf-green-light) !important; }
  .inline-form { border-top: 1px dashed var(--border); margin-top: 8px; padding-top: 8px; }
  .inline-form .row { margin-bottom: 6px; }
  .entry { border: 1px solid var(--border); border-radius: 10px; padding: 10px; margin-bottom: 8px; font-size: 13.5px; }
  .entry .top { display: flex; justify-content: space-between; align-items: center; gap: 6px; }
  .entry .meta { color: var(--text-muted); font-size: 12px; margin-top: 4px; }
  .stat-grid { display: grid; grid-template-columns: repeat(3, 1fr); gap: 8px; margin-top: 8px; }
  .stat { background: var(--gf-green-light); border-radius: 10px; padding: 10px 8px; text-align: center; }
  .stat .num { font-size: 18px; font-weight: 800; color: var(--gf-green-dark); }
  .stat .label { font-size: 11px; color: var(--text-muted); margin-top: 2px; }
  .metric-grid { display: grid; grid-template-columns: repeat(3, 1fr); gap: 8px; margin-top: 10px; }
  .metric { border: 1px solid var(--border); border-radius: 10px; padding: 8px; text-align: center; }
  .metric .num { font-size: 15px; font-weight: 700; }
  .metric .label { font-size: 10.5px; color: var(--text-muted); }
  details.sub-block { border: 1px solid var(--border); border-radius: 12px; margin-bottom: 8px; overflow: hidden; }
  details.sub-block > summary { list-style: none; cursor: pointer; padding: 12px; display: flex; justify-content: space-between; align-items: center; font-weight: 700; font-size: 14px; }
  details.sub-block > summary::-webkit-details-marker { display: none; }
  details.sub-block .body { padding: 0 12px 12px; }
  details.sales-block { border-top: 1px solid var(--border); }
  details.sales-block > summary { list-style: none; cursor: pointer; padding: 9px 4px; display: flex; justify-content: space-between; font-size: 13px; font-weight: 600; }
  details.sales-block > summary::-webkit-details-marker { display: none; }
  .empty { color: var(--text-muted); font-size: 13px; text-align: center; padding: 18px 0; }
  .search-hit { display: flex; justify-content: space-between; align-items: center; padding: 8px 0; border-bottom: 1px solid var(--border); gap: 8px; }
  .search-hit:last-child { border-bottom: none; }
  .pill-list { display: flex; flex-wrap: wrap; gap: 6px; margin-top: 6px; }
  .pill { background: var(--bg); border: 1px solid var(--border); border-radius: 999px; padding: 4px 10px; font-size: 12px; display: flex; align-items: center; gap: 6px; }
  .pill button { border: none; background: none; color: var(--danger); cursor: pointer; font-weight: 700; }
  #chartWrap { position: relative; height: 220px; margin-top: 8px; }
  .muted { color: var(--text-muted); font-size: 12px; }
  #loginScreen { display:flex; flex-direction:column; align-items:center; justify-content:center; min-height: 80vh; text-align:center; padding: 24px; }
  #loginScreen h1 { font-size: 20px; margin-bottom: 6px; }
  #loginScreen p { color: var(--text-muted); font-size: 13.5px; margin-bottom: 20px; }
  #googleSignInBtn { display:flex; align-items:center; gap:10px; background:#fff; border:1px solid var(--border); border-radius: 10px; padding: 10px 20px; font-size: 14px; font-weight:600; cursor:pointer; box-shadow: 0 1px 3px rgba(0,0,0,.08); }
</style>
</head>

      return;
    }
    state.myId = user.uid;
    state.myName = user.displayName || "";
    state.myEmail = user.email || "";

    // upsert users/{uid}
    try {
      await setDoc(doc(db, "users", state.myId), {
        name: state.myName, email: state.myEmail, updatedAt: new Date().toISOString()
      }, { merge: true });
    } catch(e){}

    // check admin
    try {
      var adminSnap = await getDoc(doc(db, "admins", state.myId));

    $("loginScreen").style.display = "none";

    setupTabs();

        $("view-dashboard").style.display = state.currentTab === "dashboard" ? "" : "none";

        if (state.currentTab === "report") refreshMyEntries();

  async function submitReport(){
    if (!state.myId){ showToast("Không xác định được danh tính của bạn.", true); return; }
    var catId = $("rCat").value;
    if (!catId){ showToast("Vui lòng chọn loại đầu việc (hoặc nhờ quản trị tạo danh mục).", true); return; }
    var desc = $("rDesc").value.trim();
    var customer = $("rCustomer").value.trim();
    var tinh = $("rTinh").value;
    var xa = $("rXa").value;
    var where = (xa && tinh) ? (xa + ", " + tinh) : (xa || tinh || "");
    var why = $("rWhy").value.trim();
    if (!desc){ showToast("Vui lòng nhập mô tả chi tiết.", true); return; }
    var btn = $("rSubmit");
    btn.disabled = true; btn.textContent = "Đang lưu...";
    try {
      var assign = state.team[state.myId] || null;
      await addDoc(collection(db, "reports"), {
        userId: state.myId,
        subId: assign ? assign.subId : null,
        subName: assign ? assign.subName : null,
        date: $("rDate").value || todayStr(),
        categoryId: catId,
        categoryName: (state.categories[catId] || {}).name || "",
        customer: customer,
        location: where,
        why: why,
        description: desc,
        status: "pending",
        reasonNotDone: "",
        sanLuong: 0, doanhThu: 0, conGiong: 0, moMoiType: "", geo: "",
        createdAt: new Date().toISOString(),
        updatedAt: new Date().toISOString()
      });
      $("rCustomer").value = ""; $("rDesc").value = ""; $("rTinh").value = ""; $("rXa").innerHTML = '<option value="">-- Xã/Phường --</option>'; $("rWhy").value = "";
      await refreshMyEntries();
    } catch(e){
      showToast("Lưu thất bại: " + (e && e.message ? e.message : "lỗi không xác định"), true);
    }
    btn.disabled = false; btn.textContent = "+ Thêm vào bảng (chưa cần chọn trạng thái)";
  }

  async function refreshMyEntries(){
    var box = $("myEntries");
    var bannerBox = $("reminderBanner");
    if (!box) return;
    if (!state.myId){ box.innerHTML = '<div class="empty">Không xác định được danh tính.</div>'; return; }
    box.innerHTML = '<div class="empty">Đang tải...</div>';
    try {
      var q = query(collection(db, "reports"), where("userId","==",state.myId), where("date","==",state.reportDate));
      var snap = await getDocs(q);
      if (snap.empty){
        box.innerHTML = '<div class="empty">Chưa có đầu việc nào trong ngày này.</div>';
        if (bannerBox) bannerBox.innerHTML = "";
        return;
      }
      var docs = [];
      snap.forEach(function(d){ docs.push({ id: d.id, data: d.data() }); });
      var pendingCount = docs.filter(function(d){ return d.data.status === "pending"; }).length;

      if (bannerBox){
        var now = new Date();
        var isToday = state.reportDate === todayStr();
        var isPast = state.reportDate < todayStr();
        var lateToday = isToday && now.getHours() >= 17;
        if (pendingCount > 0 && (isPast || lateToday)){
          bannerBox.innerHTML = '<div class="banner warn">⏰ Còn <b>'+pendingCount+'</b> đầu việc chưa cập nhật kết quả'+(isPast?" (ngày "+fmtDateVN(state.reportDate)+")":" - đã cuối ngày, cập nhật ngay để Dashboard chính xác!")+'</div>';
        } else {
          bannerBox.innerHTML = "";
        }
      }

      var html = '<div class="table-wrap"><table class="entries-table"><thead><tr>' +
        '<th>#</th><th>Nội dung</th><th>Trạng thái</th><th>Kết quả</th><th></th>' +
        '</tr></thead><tbody>';
      docs.forEach(function(item, idx){
        var d = item.id, r = item.data;
        var st = STATUS[r.status] || STATUS.pending;
        var isEditing = state.editingRowId === d;
        var resultText = "-";
        if (r.status === "done"){
          var parts = [];
          if (r.resultDescription) parts.push(esc(r.resultDescription));
          var numsStr = resultNumsHtml(r);
          if (numsStr) parts.push(numsStr);
          resultText = parts.length ? parts.join("<br>") : "Xong";
        } else if (r.status === "notdone" && r.reasonNotDone){
          resultText = "Lý do: " + esc(r.reasonNotDone);
        }
        html += '<tr>' +
          '<td class="stt">'+(idx+1)+'</td>' +
          '<td class="content-cell">' +
            '<b>'+esc(r.categoryName || "")+'</b>' +
            (r.description ? '<div class="cmeta">'+esc(r.description)+'</div>' : "") +
            extrasLineHtml(r, "cmeta") +
          '</td>' +
          '<td class="status-cell">' +
            '<span class="badge '+st.cls+'">'+st.label+'</span>' +
            '<div class="icon-row">' +
              '<button class="icon-btn tickDone'+(r.status==="done"?" on-done":"")+'" title="Hoàn thành" data-id="'+esc(d)+'">✅</button>' +
              '<button class="icon-btn tickProgress'+(r.status==="progress"?" on-progress":"")+'" title="Đang làm" data-id="'+esc(d)+'">🔄</button>' +
              '<button class="icon-btn tickNotdone'+(r.status==="notdone"?" on-notdone":"")+'" title="Chưa xong" data-id="'+esc(d)+'">❌</button>' +
            '</div>' +
          '</td>' +
          '<td class="result-cell">'+resultText+'</td>' +
          '<td class="del-cell"><a data-del="'+esc(d)+'" title="Xóa">✕</a></td>' +
        '</tr>';
        if (isEditing){
          html += '<tr class="inline-form-row"><td colspan="5">' + renderInlineForm(d, r) + '</td></tr>';
        }
      });
      html += '</tbody></table></div>';
      box.innerHTML = html;

      box.querySelectorAll(".tickDone").forEach(function(b){ b.addEventListener("click", function(){ openInlineForm(b.dataset.id, "done"); }); });
      box.querySelectorAll(".tickProgress").forEach(function(b){ b.addEventListener("click", function(){ setStatus(b.dataset.id, "progress", {}); }); });
      box.querySelectorAll(".tickNotdone").forEach(function(b){ b.addEventListener("click", function(){ openInlineForm(b.dataset.id, "notdone"); }); });
      box.querySelectorAll("a[data-del]").forEach(function(a){
        a.addEventListener("click", function(){
          armConfirm(a, async function(){
            await deleteDoc(doc(db, "reports", a.dataset.del));
            refreshMyEntries();
          }, "Bấm lần nữa để xóa");
        });
      });
      wireInlineForm(box);
    } catch(e){
      box.innerHTML = '<div class="empty">Lỗi tải dữ liệu: '+esc(e.message||"")+'</div>';
    }
  }

  function openInlineForm(id, mode){ state.editingRowId = id; state.editingMode = mode; refreshMyEntries(); }

  function wireInlineForm(box){
    var form = box.querySelector(".inline-form");
    if (!form) return;
    var cancelBtn = form.querySelector(".cancelBtn");
    if (cancelBtn) cancelBtn.addEventListener("click", function(){ state.editingRowId = null; state.editingMode = null; refreshMyEntries(); });
    var geoBtn = form.querySelector(".geoBtn");
    if (geoBtn) geoBtn.addEventListener("click", function(){
      if (!navigator.geolocation){ showToast("Trình duyệt/thiết bị không hỗ trợ định vị. Bạn có thể tự nhập tọa độ vào ô bên cạnh.", true); return; }
      geoBtn.disabled = true; geoBtn.textContent = "Đang lấy vị trí...";
      navigator.geolocation.getCurrentPosition(function(pos){
        var geo = pos.coords.latitude.toFixed(6) + "," + pos.coords.longitude.toFixed(6);
        form.querySelector(".fGeo").value = geo;
        geoBtn.disabled = false; geoBtn.textContent = "📍 Lấy lại vị trí";
      }, function(err){
        showToast("Không lấy được vị trí (" + (err && err.message ? err.message : "lỗi") + "). Bạn có thể tự nhập tọa độ vào ô bên cạnh.", true);
        geoBtn.disabled = false; geoBtn.textContent = "📍 Lấy vị trí hiện tại";
      }, { enableHighAccuracy: true, timeout: 10000 });
    });
    var confirmBtn = form.querySelector(".confirmBtn");
    if (confirmBtn) confirmBtn.addEventListener("click", async function(){
      var id = confirmBtn.dataset.id;
      var mode = confirmBtn.dataset.mode;
      if (mode === "done"){
        var resultDesc = form.querySelector(".fResult").value.trim();
        if (!resultDesc){ showToast("Vui lòng nhập mô tả kết quả công việc.", true); return; }
        var sl = Number(form.querySelector(".fSl").value) || 0;
        var dt = Number(form.querySelector(".fDt").value) || 0;
        var cg = Number(form.querySelector(".fCg").value) || 0;
        var slType = form.querySelector(".fSlType").value;
        var dtType = form.querySelector(".fDtType").value;
        var cgType = form.querySelector(".fCgType").value;
        var moMoiType = form.querySelector(".fMoMoiType").value;
        var geo = form.querySelector(".fGeo").value.trim();
        await setStatus(id, "done", { resultDescription: resultDesc, sanLuong: sl, doanhThu: dt, conGiong: cg, slType: slType, dtType: dtType, cgType: cgType, moMoiType: moMoiType, geo: geo });
      } else {
        var reason = form.querySelector(".fReason").value.trim();
        if (!reason){ showToast("Vui lòng nhập lý do chưa hoàn thành.", true); return; }
        await setStatus(id, "notdone", { reasonNotDone: reason });
      }
    });
  }

  async function setStatus(id, status, extra){
    try {
      var payload = Object.assign({ status: status, updatedAt: new Date().toISOString() }, extra || {});
      if (status !== "notdone") payload.reasonNotDone = "";
      if (status !== "done"){ payload.sanLuong = payload.sanLuong||0; payload.doanhThu = payload.doanhThu||0; payload.conGiong = payload.conGiong||0; payload.resultDescription = ""; payload.slType = ""; payload.dtType = ""; payload.cgType = ""; payload.moMoiType = ""; payload.geo = ""; }
      await updateDoc(doc(db, "reports", id), payload);
      state.editingRowId = null; state.editingMode = null;
      refreshMyEntries();
    } catch(e){
      showToast("Cập nhật thất bại: " + (e && e.message ? e.message : "lỗi không xác định"), true);
    }
  }

  function renderDashControls(){
    var box = $("dashControls");
    if (state.dashMode === "day"){
      box.innerHTML = '<label>Chọn ngày</label><input type="date" id="dashDate" value="'+state.dashDate+'">';

      if (!state.rangeFrom){
        var d = new Date(); d.setDate(d.getDate()-6);
        state.rangeFrom = d.toISOString().slice(0,10);
        state.rangeTo = todayStr();
      }
      box.innerHTML = '<div class="row">' +
        '<div><label>Từ ngày</label><input type="date" id="dashFrom" value="'+state.rangeFrom+'"></div>' +
        '<div><label>Đến ngày</label><input type="date" id="dashTo" value="'+state.rangeTo+'"></div>' +
        '</div>';
      $("dashFrom").addEventListener("change", function(e){ state.rangeFrom = e.target.value; refreshDashboard(); });
      $("dashTo").addEventListener("change", function(e){ state.rangeTo = e.target.value; refreshDashboard(); });
    }
  }

  async function refreshDashboard(){
    var box = $("dashResult");
    box.innerHTML = '<div class="card"><div class="empty">Đang tải dữ liệu...</div></div>';
    var reports = [];
    try {
      if (state.dashMode === "day"){
        var q = query(collection(db, "reports"), where("date","==",state.dashDate));
        var snap = await getDocs(q);
        snap.forEach(function(d){ reports.push(d.data()); });
      } else {
        var q2 = query(collection(db, "reports"), where("date",">=",state.rangeFrom), where("date","<=",state.rangeTo));
        var snap2 = await getDocs(q2);
        snap2.forEach(function(d){ reports.push(d.data()); });
      }
    } catch(e){
      box.innerHTML = '<div class="card"><div class="empty">Lỗi tải dữ liệu: '+esc(e.message||"")+'</div></div>';
      return;
    }
    if (state.dashMode === "day") renderDayDashboard(reports);
    else renderRangeDashboard(reports);
  }

  function summarize(reports){
    var s = { total: reports.length, done:0, progress:0, notdone:0, pending:0, sanLuong:0, doanhThu:0, conGiong:0 };
    reports.forEach(function(r){
      if (r.status === "done") s.done++;
      else if (r.status === "notdone") s.notdone++;
      else if (r.status === "pending") s.pending++;
      else s.progress++;
      s.sanLuong += Number(r.sanLuong)||0;
      s.doanhThu += Number(r.doanhThu)||0;
      s.conGiong += Number(r.conGiong)||0;
    });
    return s;
  }

  function statBlockHtml(s){
    return '<div class="stat-grid">' +
      '<div class="stat"><div class="num">'+s.total+'</div><div class="label">Tổng đầu việc</div></div>' +
      '<div class="stat"><div class="num">'+s.done+'</div><div class="label">Hoàn thành</div></div>' +
      '<div class="stat"><div class="num">'+s.progress+'</div><div class="label">Đang tiến hành</div></div>' +
      '</div>' +
      '<div class="metric-grid">' +
        '<div class="metric"><div class="num">'+s.notdone+'</div><div class="label">Chưa hoàn thành</div></div>' +
        '<div class="metric"><div class="num">'+s.pending+'</div><div class="label">Chưa cập nhật</div></div>' +
        '<div class="metric"><div class="num">'+fmtNum(s.sanLuong)+'</div><div class="label">Sản lượng (tấn)</div></div>' +
      '</div>' +
      '<div class="metric-grid">' +
        '<div class="metric"><div class="num">'+fmtNum(s.doanhThu)+'</div><div class="label">Doanh thu (tr)</div></div>' +
        '<div class="metric" style="grid-column: span 2"><div class="num">'+fmtNum(s.conGiong)+' con</div><div class="label">Con giống</div></div>' +
      '</div>';
  }

  // Dùng icon thay vì nhãn chữ, và &nbsp; nối icon với chữ đầu tiên để tránh bị tách dòng giữa nhãn và giá trị khi cột hẹp.
  function extrasLineHtml(r, cls){
    var parts = [];
    if (r.customer) parts.push('<span class="ex" title="Với ai">👤&nbsp;'+esc(r.customer)+'</span>');
    if (r.location) parts.push('<span class="ex" title="Ở đâu">📍&nbsp;'+esc(r.location)+'</span>');
    if (r.why) parts.push('<span class="ex" title="Tại sao">🎯&nbsp;'+esc(r.why)+'</span>');
    return parts.length ? '<div class="'+cls+'">'+parts.join(' ')+'</div>' : "";

  function xaOptionsHtml(tinh, selected){
    var list = DIA_BAN[tinh] || [];
    return '<option value="">-- Xã/Phường --</option>' + list.map(function(x){

  // Tách chuỗi "Xã, Tỉnh" đã lưu thành 2 phần để hiển thị lại vào dropdown khi sửa.
  function splitDiaBan(location){
    if (!location) return { tinh: "", xa: "" };
    var idx = location.lastIndexOf(", ");
    if (idx === -1) return { tinh: "", xa: location };
    var xa = location.slice(0, idx), tinh = location.slice(idx+2);
    if (!DIA_BAN[tinh]) return { tinh: "", xa: location };
    return { tinh: tinh, xa: xa };
  }

  function typeOptionsHtml(typesObj, selected){
    var ids = Object.keys(typesObj);
    var html = '<option value="">-- Chọn loại --</option>';
    html += ids.map(function(id){
      var name = typesObj[id].name;
      return '<option value="'+esc(name)+'"'+(name===selected?" selected":"")+'>'+esc(name)+'</option>';
    }).join("");
    return html;
  }

  function resultNumsHtml(r){
    if (r.status !== "done") return "";
    var parts = [];
    if (r.sanLuong) parts.push("SL: "+fmtNum(r.sanLuong)+" tấn"+(r.slType?" ("+esc(r.slType)+")":""));
    if (r.doanhThu) parts.push("DT: "+fmtNum(r.doanhThu)+" tr"+(r.dtType?" ("+esc(r.dtType)+")":""));
    if (r.conGiong) parts.push("Con giống: "+fmtNum(r.conGiong)+" con"+(r.cgType?" ("+esc(r.cgType)+")":""));
    if (r.moMoiType) parts.push("Mở mới: "+esc(r.moMoiType));
    if (r.geo) parts.push('<a href="https://maps.google.com/?q='+encodeURIComponent(r.geo)+'" target="_blank" rel="noopener">📍 Bản đồ</a>');
    return parts.join(" · ");
  }

  function renderDayDashboard(reports){
    var box = $("dashResult");
    var overall = summarize(reports);
    var bySub = {};
    reports.forEach(function(r){
      var key = r.subId || "__none__";
      if (!bySub[key]) bySub[key] = { name: r.subName || "Chưa gán Sub", items: [] };
      bySub[key].items.push(r);
    });

    var html = '<div class="card"><h2>Toàn vùng - '+fmtDateVN(state.dashDate)+'</h2>' + statBlockHtml(overall) + '</div>';
    var subKeys = Object.keys(bySub);
    if (!subKeys.length){
      html += '<div class="card"><div class="empty">Chưa có báo cáo nào trong ngày này.</div></div>';
    } else {
      html += '<div class="card"><h2>Chi tiết theo Sub</h2>';
      subKeys.forEach(function(key){
        var sub = bySub[key];
        var s = summarize(sub.items);
        var byEmp = {};
        sub.items.forEach(function(r){
          var uid = r.userId || "__unknown__";
          if (!byEmp[uid]) byEmp[uid] = [];
          byEmp[uid].push(r);
        });
        var empHtml = Object.keys(byEmp).map(function(uid){
          var items = byEmp[uid];
          var es = summarize(items);
          var rows = items.map(function(r){
            var st = STATUS[r.status] || STATUS.pending;
            var numsHtml = resultNumsHtml(r);
            return '<div class="entry"><div class="top"><b>'+esc(r.categoryName || "")+'</b><span class="badge '+st.cls+'">'+st.label+'</span></div>' +
              (r.description ? '<div class="meta">Mô tả: '+esc(r.description)+'</div>' : "") +
              extrasLineHtml(r, "meta") +
              (r.status === "done" && r.resultDescription ? '<div class="meta">Kết quả: '+esc(r.resultDescription)+'</div>' : "") +
              (numsHtml ? '<div class="meta">'+numsHtml+'</div>' : "") +
              (r.status === "notdone" && r.reasonNotDone ? '<div class="meta">Lý do: '+esc(r.reasonNotDone)+'</div>' : "") + '</div>';
          }).join("");
          return '<details class="sales-block"><summary><span>'+esc(empName(uid))+'</span><span>'+es.total+' việc ('+es.done+' xong)</span></summary><div class="body">'+rows+'</div></details>';
        }).join("");
        html += '<details class="sub-block"><summary><span>'+esc(sub.name)+'</span>' +
          '<span class="badge progress">'+s.total+' việc</span></summary>' +
          '<div class="body">' + statBlockHtml(s) +
          '<h3 style="margin-top:12px">Theo nhân viên</h3>' + empHtml +
          '</div></details>';
      });
      html += '</div>';
    }
    box.innerHTML = html;
  }

  function renderRangeDashboard(reports){
    var box = $("dashResult");
    var overall = summarize(reports);
    var html = '<div class="card"><h2>Tổng '+fmtDateVN(state.rangeFrom)+' → '+fmtDateVN(state.rangeTo)+'</h2>' +
      statBlockHtml(overall) +
      '<h3>Xu hướng đầu việc theo ngày</h3>' +
      '<div id="chartWrap"><canvas id="trendChart"></canvas></div>' +
      '</div>';

    var bySub = {};
    reports.forEach(function(r){
      var key = r.subId || "__none__";
      if (!bySub[key]) bySub[key] = { name: r.subName || "Chưa gán Sub", items: [] };
      bySub[key].items.push(r);
    });
    var subKeys = Object.keys(bySub);
    if (subKeys.length){
      html += '<div class="card"><h2>So sánh theo Sub</h2>';
      subKeys.forEach(function(key){
        var s = summarize(bySub[key].items);
        html += '<div class="entry"><div class="top"><b>'+esc(bySub[key].name)+'</b><span class="badge progress">'+s.total+' việc</span></div>' +
          '<div class="meta">Hoàn thành: '+s.done+' · Đang làm: '+s.progress+' · Chưa xong: '+s.notdone+' · Chưa cập nhật: '+s.pending+' · SL: '+fmtNum(s.sanLuong)+' tấn · DT: '+fmtNum(s.doanhThu)+' tr</div></div>';
      });
      html += '</div>';
    }
    box.innerHTML = html;

    var byDate = {};
    reports.forEach(function(r){
      if (!byDate[r.date]) byDate[r.date] = {done:0, progress:0, notdone:0, pending:0};
      if (r.status === "done") byDate[r.date].done++;
      else if (r.status === "notdone") byDate[r.date].notdone++;
      else if (r.status === "pending") byDate[r.date].pending++;
      else byDate[r.date].progress++;
    });
    var dates = [];
    var cur = new Date(state.rangeFrom+"T00:00:00");
    var end = new Date(state.rangeTo+"T00:00:00");
    while (cur <= end){
      dates.push(cur.getFullYear()+"-"+String(cur.getMonth()+1).padStart(2,"0")+"-"+String(cur.getDate()).padStart(2,"0"));
      cur.setDate(cur.getDate()+1);
    }
    var doneArr = dates.map(function(d){ return (byDate[d]||{}).done||0; });
    var progArr = dates.map(function(d){ return (byDate[d]||{}).progress||0; });
    var notArr = dates.map(function(d){ return (byDate[d]||{}).notdone||0; });
    var pendArr = dates.map(function(d){ return (byDate[d]||{}).pending||0; });
    var labels = dates.map(fmtDateVN);

    if (state.chart){ state.chart.destroy(); state.chart = null; }
    if (window.Chart){
      var ctx = document.getElementById("trendChart");
      state.chart = new Chart(ctx, {
        type: "bar",
        data: { labels: labels, datasets: [
          { label: "Hoàn thành", data: doneArr, backgroundColor: "#00843D" },
          { label: "Đang tiến hành", data: progArr, backgroundColor: "#e0a900" },
          { label: "Chưa hoàn thành", data: notArr, backgroundColor: "#c62828" },
          { label: "Chưa cập nhật", data: pendArr, backgroundColor: "#8a97a0" }
        ]},
        options: {
          responsive: true, maintainAspectRatio: false,
          scales: { x: { stacked: true }, y: { stacked: true, beginAtZero: true, ticks: { precision:0 } } },
          plugins: { legend: { position: "bottom", labels: { boxWidth: 10, font: { size: 11 } } } }
        }
      });
    }
  }

        var sel = box.querySelector('.assignSel[data-id="'+b.dataset.id+'"]');
        var subId = sel.value;
        if (!subId){ showToast("Chọn Sub trước khi gán.", true); return; }
        await setDoc(doc(db, "team", b.dataset.id), { subId: subId, subName: state.subs[subId].name });
        state.team[b.dataset.id] = { subId: subId, subName: state.subs[subId].name };
        renderTeamList();
      });
    });
  }

  function renderTeamList(){
    var box = $("teamList");
    var uids = Object.keys(state.team);
    if (!uids.length){ box.innerHTML = '<div class="empty">Chưa gán ai.</div>'; return; }
    box.innerHTML = uids.map(function(uid){
      var name = empName(uid);
      var t = state.team[uid];
      return '<div class="search-hit"><span>'+esc(name)+' <span class="muted">('+esc(t.subName)+')</span></span>' +
        '<button class="btn small danger" data-id="'+esc(uid)+'">Bỏ gán</button></div>';
    }).join("");
    box.querySelectorAll("button").forEach(function(b){
      b.addEventListener("click", async function(){
        await deleteDoc(doc(db, "team", b.dataset.id));
        delete state.team[b.dataset.id];
        renderTeamList();
      });
    });
  }

})();
</script>
<script src="https://cdnjs.cloudflare.com/ajax/libs/Chart.js/4.4.4/chart.umd.min.js"></script>
</body>
</html>
